<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#141829">
  <title>Banc d'essai</title>
  <link rel="icon" href="images/dice.png">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    /* Page provisoire : mêmes couleurs que le jeu, sans charger sa feuille de style */
    :root {
      --bg-dark: #0a0e1a;
      --bg-panel: #141829;
      --surface-2: #1c2138;
      --accent-gold: #ffd700;
      --text-primary: #e8eaf0;
      --text-secondary: #8890a8;
      --border-color: #2a3050;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-dark); color: var(--text-primary);
      overscroll-behavior: none; touch-action: manipulation;
    }

    /* --- Réglages --- */
    #side {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px;
      padding: 9px 14px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color);
    }
    h1 { margin: 0; font-size: 1.05rem; }
    .group { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--text-secondary); }
    .seg { display: inline-flex; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
    .seg button {
      padding: 6px 11px; border: 0; border-right: 1px solid var(--border-color);
      background: var(--bg-dark); color: var(--text-primary); font: inherit; cursor: pointer; white-space: nowrap;
    }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: var(--surface-2); }
    .seg button.active { background: var(--surface-2); color: var(--accent-gold); }
    .seg button:disabled { opacity: 0.5; cursor: default; }
    #hint { margin: 0 0 0 auto; font-size: 0.78rem; color: var(--text-secondary); }
    #error { margin: 0; padding: 12px 16px; color: #ff8a8a; }
    #style-group { display: none; } /* onglets des dessins : petit écran seulement */

    /* --- Vues : hautes et étroites, côte à côte (la foudre tombe de haut) --- */
    #bench {
      flex: 1; min-height: 0; padding: 10px;
      display: grid; grid-template-columns: repeat(var(--count, 4), 1fr); grid-template-rows: 1fr; gap: 10px;
    }
    .view {
      display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
      background: var(--bg-panel); border: 2px solid var(--border-color); border-radius: 8px;
    }
    .view.playing { border-color: var(--accent-gold); }
    .view header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; padding: 7px 10px; }
    .view h2 { margin: 0; font-size: 0.95rem; }
    .view h2 .num { color: var(--accent-gold); }
    /* Quatre lignes réservées : les vues gardent la même hauteur quelle que soit la longueur du texte */
    .view p { grid-column: 1 / -1; margin: 0; min-height: 5.2em; font-size: 0.78rem; line-height: 1.3; color: var(--text-secondary); }
    .view header button {
      padding: 5px 10px; border: 1px solid var(--border-color); border-radius: 6px;
      background: var(--bg-dark); color: var(--text-primary); font: inherit; font-size: 0.82rem; cursor: pointer;
    }
    .view header button:hover { border-color: var(--accent-gold); }
    /* La vue 3D remplit ce cadre ; son canvas ne doit pas peser sur la mise en page */
    .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #1a1a2e; }
    .stage canvas { position: absolute; left: 0; top: 0; }

    /* --- Petit écran (classe posée par essais.js) : une seule vue, un onglet par dessin --- */
    body.single #side { gap: 7px 14px; padding: 7px 10px; }
    body.single h1 { width: 100%; font-size: 0.95rem; }
    body.single #hint, body.single #mode-group { display: none; }
    body.single #style-group { display: flex; width: 100%; }
    body.single #style-group .seg { flex: 1; }
    body.single #style-group button { flex: 1; padding: 9px 2px; font-size: 0.8rem; font-weight: 600; }
    body.single .seg button { padding: 7px 9px; }
    body.single #bench { grid-template-columns: 1fr; padding: 6px; }
    body.single .view + .view { display: none; }
    body.single .view p { min-height: 0; }

    /* Téléphone couché : les réglages à gauche, la vue sur toute la hauteur */
    @media (max-height: 500px) {
      body.single { flex-direction: row; }
      body.single #side {
        flex: none; flex-direction: column; flex-wrap: nowrap; align-items: flex-start; width: 292px; overflow-y: auto;
        padding-left: max(10px, env(safe-area-inset-left, 0px));
        border-bottom: 0; border-right: 1px solid var(--border-color);
      }
      body.single .group { flex-direction: column; align-items: flex-start; gap: 3px; }
      body.single #style-group .seg { width: 100%; }
      body.single .view p { display: none; }
    }
  </style>
</head>
<body>
  <div id="side">
    <h1>Banc d'essai</h1>
    <div class="group" id="style-group">
      <div class="seg" data-setting="style"></div>
    </div>
    <!-- Variante de l'effet à l'essai (remplie par essais.js) -->
    <div class="group" id="option-group"><span id="option-label"></span>
      <div class="seg" data-setting="option"></div>
    </div>
    <div class="group">Ambiance
      <div class="seg" data-setting="ambiance">
        <button type="button" data-value="Verger">Prairie</button>
        <button type="button" data-value="Moisson">Coucher de soleil</button>
        <button type="button" data-value="Givre">Neige</button>
        <button type="button" data-value="Lanterne">Nuit</button>
      </div>
    </div>
    <div class="group">Vitesse
      <div class="seg" data-setting="speed">
        <button type="button" data-value="0.3">Ralenti</button>
        <button type="button" data-value="1">×1</button>
        <button type="button" data-value="2">×2</button>
        <button type="button" data-value="4">×4</button>
      </div>
    </div>
    <div class="group" id="mode-group">Lecture
      <div class="seg" data-setting="mode">
        <button type="button" data-value="turns">Tour à tour</button>
        <button type="button" data-value="together">Toutes ensemble</button>
        <button type="button" data-value="manual">À la demande</button>
      </div>
    </div>
    <p id="hint">Dans chaque vue : glisser pour tourner, molette pour zoomer, clic droit pour déplacer.</p>
  </div>
  <p id="error" hidden></p>
  <main id="bench"></main>
  <script type="module" src="js/essais.js"></script>
</body>
</html>
